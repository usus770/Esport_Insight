version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: esports-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./app.db
    volumes:
      - ./backend/app:/app/app
      - ./dataset:/dataset
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    container_name: esports-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host
  # Database service can be added here if switching to PostgreSQL
